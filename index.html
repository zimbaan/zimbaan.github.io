    <!-- Static first frame of the preloader so something paints before the JS bundle runs.
         React's <Preloader> renders the same layout and removes this on mount. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 110; display: flex; flex-direction: column; justify-content: space-between;
        background: #050506; color: #8b8b96; padding: 1.5rem; font: 14px/1.5 "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace; }
      #boot .count { font-family: "Space Grotesk Variable", ui-sans-serif, system-ui, sans-serif; font-weight: 600; color: #ededf0;
        font-size: clamp(4rem, 16vw, 11rem); line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; margin: 0; }
      #boot .count span { color: #7c5cff; }
      #boot .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; }
      #boot p { margin: 0; }
      #boot .hint { font-size: 12px; line-height: 1rem; }
      @media (min-width: 640px) { #boot { padding: 2.5rem; } }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#ededf0;background:#050506">
        Kapil Adhithya N, AI/ML Engineer. Email: kapiladhithya@gmail.com
      </p>
    </noscript>
    <div id="boot" aria-hidden="true">
      <p>&gt; loading model weights...</p>
      <div class="row">
        <p class="hint">Click anywhere to skip</p>
        <p class="count">0<span>%</span></p>
      </div>
    </div>
    <script>
      // Repeat visits and reduced-motion users skip the preloader, so drop the boot frame right away.
      try {
        if (sessionStorage.getItem("kapil:booted") || matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.getElementById("boot").remove();
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
